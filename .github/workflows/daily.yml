name: Daily goal-scorer board

on:
  schedule:
    # 2:45 PM Central year-round. Actions cron is UTC-only and ignores DST, so we
    # list both offsets; the `gate` job below lets only the correct one through.
    - cron: "45 19 * * *"         # 14:45 CT during CDT (summer, UTC-5)
    - cron: "45 20 * * *"         # 14:45 CT during CST (winter, UTC-6)
  workflow_dispatch:
    inputs:
      pull_odds:
        description: "Pull Vegas odds (spends ~10 API credits)"
        default: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Both cron triggers fire (an hour apart); only the one that is 2:45 PM Central
  # right now proceeds. Manual (workflow_dispatch) runs always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/Chicago date +%H)" = "14" ]; then
            echo "2:45 PM Central — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "not 2:45 PM Central (hour=$(TZ=America/Chicago date +%H) CT) — skipping this trigger"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build board
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          DATE=$(TZ=America/New_York date +%F)
          echo "Building board for $DATE"
          python -m scripts.predict_slate_today "$DATE"
          if [ "${{ github.event.inputs.pull_odds || 'true' }}" = "true" ]; then
            python -m scripts.merge_odds "$DATE" || echo "odds pull skipped/failed — board shows model only"
          fi
          python -m scripts.build_dashboard "$DATE"
          mkdir -p site
          cp "dashboard_$DATE.html" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

